<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GM Portal - Project Rewind</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #0a0d1a; color: #f0f2f5; padding: 2rem; }
    h1 { color: #00d4b8; border-bottom: 1px solid #333; padding-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 2rem; background: #13172c; border-radius: 8px; overflow: hidden; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
    th { background: rgba(0,212,184,0.1); color: #00d4b8; }
    .completed { color: #20c997; font-weight: bold; }
    .playing { color: #ffd166; }
    .empty { text-align: center; color: #888; padding: 2rem; }
    .btn-abort {
      background: #dc3545;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn-abort:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <h1>GM PORTAL: Live Tracker</h1>
  <p>Auto-refreshing every 3 seconds...</p>
  <table>
    <thead>
      <tr>
            <th>Team Name</th>
            <th>Current Stage</th>
            <th>Status</th>
            <th>Last Active</th>
            <th>Actions</th>
          </tr>
        </thead>
    <tbody id="table-body">
      <tr><td colspan="5" class="empty">Loading...</td></tr>
    </tbody>
  </table>

  <div id="login-screen" style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
    <div class="card" style="max-width:400px; width:100%;">
      <h1 style="color:var(--accent-teal); font-size:1.5rem; margin-bottom:1rem;">GM Authentication</h1>
      <div class="form-group">
        <input type="password" id="gm-password" placeholder="Enter GM password..." style="padding:0.8rem; border-radius:6px; border:1px solid var(--border-subtle); background:rgba(0,0,0,0.2); color:white; font-size:1rem; outline:none; width:100%;" autocomplete="off">
        <button onclick="gmLogin()" style="padding:0.8rem; background:var(--accent-teal); color:#000; border:none; border-radius:6px; font-weight:bold; font-size:1rem; cursor:pointer;">↳ Access GM Portal</button>
        <div id="gm-login-error" style="color:var(--accent-red); margin-top:0.5rem; display:none;"></div>
      </div>
    </div>
  </div>

  <div id="gm-dashboard" style="display:none;">
    <h1>GM PORTAL: Live Tracker</h1>
    <p>Auto-refreshing every 3 seconds...</p>
    <table>
      <thead>
        <tr>
          <th>Team Name</th>
          <th>Current Stage</th>
          <th>Status</th>
          <th>Last Active</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="5" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let gmToken = sessionStorage.getItem('gm_token') || '';
    let pollInterval = null;

    function gmLogin() {
      const pw = document.getElementById('gm-password').value.trim();
      if (!pw) return;
      gmToken = pw;
      sessionStorage.setItem('gm_token', pw);
      fetchProgress().then(ok => {
        if (ok) {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('gm-dashboard').style.display = 'block';
          pollInterval = setInterval(fetchProgress, 3000);
        } else {
          document.getElementById('gm-login-error').style.display = 'block';
          document.getElementById('gm-login-error').textContent = 'Invalid GM password.';
          sessionStorage.removeItem('gm_token');
        }
      });
    }

    async function fetchProgress() {
      try {
        const res = await fetch('/api/progress', {
          headers: { 'Authorization': 'Bearer ' + gmToken }
        });
        if (res.status === 401) return false;
        const data = await res.json();
        const tbody = document.getElementById('table-body');
        
        const teams = Object.keys(data);
        if (teams.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">No teams have logged in yet.</td></tr>';
          return true;
        }

        tbody.innerHTML = '';
        teams.forEach(team => {
          const info = data[team];
          const tr = document.createElement('tr');

          const tdName = document.createElement('td');
          const strong = document.createElement('strong');
          strong.textContent = team;
          tdName.appendChild(strong);
          tr.appendChild(tdName);

          const tdStage = document.createElement('td');
          tdStage.textContent = info.current_stage || '';
          tr.appendChild(tdStage);

          const tdStatus = document.createElement('td');
          tdStatus.className = info.completed ? 'completed' : 'playing';
          tdStatus.textContent = info.completed ? 'FINISHED' : 'PLAYING';
          tr.appendChild(tdStatus);

          const tdTime = document.createElement('td');
          tdTime.textContent = info.last_updated || '';
          tr.appendChild(tdTime);

          const tdAction = document.createElement('td');
          const abortBtn = document.createElement('button');
          abortBtn.className = 'btn-abort';
          abortBtn.textContent = 'Abort & Reset';
          abortBtn.onclick = () => abortTeam(team);
          tdAction.appendChild(abortBtn);
          tr.appendChild(tdAction);

          tbody.appendChild(tr);
        });
        return true;
      } catch (e) {
        console.error('Failed to fetch progress', e);
        return false;
      }
    }

    function abortTeam(teamName) {
      if (confirm('Are you sure you want to abort and reset team: ' + teamName + '?')) {
        fetch('/api/abort', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + gmToken },
          body: JSON.stringify({ team: teamName })
        }).then(() => fetchProgress());
      }
    }

    // Auto-login if token stored
    if (gmToken) {
      fetchProgress().then(ok => {
        if (ok) {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('gm-dashboard').style.display = 'block';
          pollInterval = setInterval(fetchProgress, 3000);
        } else {
          sessionStorage.removeItem('gm_token');
        }
      });
    }

    // Cleanup interval on page unload
    window.addEventListener('beforeunload', function() {
      if (pollInterval) clearInterval(pollInterval);
    });
  </script>
</body>
</html>
