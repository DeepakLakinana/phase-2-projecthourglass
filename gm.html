<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GM Portal - Project Rewind</title>
  <style>
    :root {
      --bg: #0a0d1a;
      --bg-card: #13172c;
      --text: #f0f2f5;
      --text-muted: #6b7280;
      --teal: #00d4b8;
      --gold: #ffd166;
      --red: #ff3b5c;
      --green: #20c997;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
    h1 { color: var(--teal); font-size: 1.6rem; }
    .stats { display: flex; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem 1.5rem; min-width: 120px;
    }
    .stat-num { font-size: 1.8rem; font-weight: bold; color: var(--teal); }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-top: 0.2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; background: var(--bg-card); border-radius: 8px; overflow: hidden; }
    th { background: rgba(0,212,184,0.08); color: var(--teal); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
    td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .empty { text-align: center; color: var(--text-muted); padding: 2rem; }
    .badge {
      display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px;
      font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .badge-fin { background: rgba(32,201,151,0.15); color: var(--green); }
    .badge-play { background: rgba(255,209,102,0.12); color: var(--gold); }
    .badge-wait { background: rgba(107,114,128,0.12); color: var(--text-muted); }
    .check { color: var(--green); font-weight: bold; }
    .cross { color: var(--text-muted); }
    .btn-abort {
      background: transparent; color: var(--red); border: 1px solid rgba(255,59,92,0.3);
      padding: 0.35rem 0.7rem; border-radius: 4px; cursor: pointer;
      font-size: 0.75rem; font-weight: 600; transition: all 0.15s;
    }
    .btn-abort:hover { background: rgba(255,59,92,0.15); border-color: var(--red); }
    .refresh-note { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.5rem; }
    .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.3rem; }
    .login-container {
      display: flex; align-items: center; justify-content: center; min-height: 80vh;
    }
    .login-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 2rem; max-width: 380px; width: 100%;
    }
    .login-card h1 { font-size: 1.3rem; margin-bottom: 1.2rem; }
    .login-card input {
      width: 100%; padding: 0.75rem 1rem; border-radius: 6px;
      border: 1px solid var(--border); background: rgba(0,0,0,0.25);
      color: white; font-size: 1rem; outline: none; margin-bottom: 0.8rem;
    }
    .login-card input:focus { border-color: var(--teal); }
    .login-card button {
      width: 100%; padding: 0.75rem; background: var(--teal); color: #000;
      border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer;
    }
    .login-card button:hover { opacity: 0.9; }
    .login-error { color: var(--red); margin-top: 0.5rem; display: none; font-size: 0.85rem; }
    .puzzle-dots { display: flex; gap: 4px; flex-wrap: wrap; }
    .puzzle-dot {
      width: 18px; height: 18px; border-radius: 3px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: bold;
    }
    .puzzle-dot.done { background: rgba(32,201,151,0.2); color: var(--green); }
    .puzzle-dot.pending { background: rgba(107,114,128,0.15); color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- DASHBOARD -->
  <div id="gm-dashboard">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
      <div>
        <h1>⟁ PROJECT REWIND — GM PORTAL</h1>
        <p class="subtitle">Live team tracker &mdash; auto-refreshes every 3s</p>
      </div>
      <button class="btn-abort" onclick="resetAll()" style="border-color:var(--gold);color:var(--gold);">↺ Reset All Teams</button>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats-row">
      <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total Teams</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--gold)" id="stat-playing">0</div><div class="stat-label">In Progress</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--green)" id="stat-finished">0</div><div class="stat-label">Finished</div></div>
    </div>

    <!-- Table -->
    <table>
      <thead>
        <tr>
          <th>Team</th>
          <th>Progress</th>
          <th>Status</th>
          <th>Last Active</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="5" class="empty">Loading...</td></tr>
      </tbody>
    </table>
    <p class="refresh-note" id="last-refresh"></p>
  </div>

  <script>
    const STAGE_LABELS = [
      { key: 'Intro Story', short: 'Intro' },
      { key: 'Round 1: Year Challenge', short: 'R1:Y' },
      { key: 'Round 1: Month Challenge', short: 'R1:M' },
    ];
    for (let i = 1; i <= 7; i++) {
      STAGE_LABELS.push({ key: 'Date Challenge: Puzzle ' + i, short: 'R2:P' + i });
    }
    STAGE_LABELS.push({ key: 'Round 2: Morse Code', short: 'R2:Mc' });
    STAGE_LABELS.push({ key: 'Victory!', short: 'Victory' });

    let pollInterval = null;

    function stageCompleted(stages, key) {
      return stages.some(s => s.toLowerCase() === key.toLowerCase());
    }

    function renderDots(completedStages) {
      const stages = STAGE_LABELS;
      const container = document.createElement('div');
      container.className = 'puzzle-dots';
      stages.forEach(s => {
        const dot = document.createElement('span');
        dot.className = 'puzzle-dot' + (stageCompleted(completedStages, s.key) ? ' done' : ' pending');
        dot.textContent = stageCompleted(completedStages, s.key) ? '✓' : '·';
        dot.title = s.key;
        container.appendChild(dot);
      });
      return container;
    }

    function renderProgressText(completedStages) {
      const done = STAGE_LABELS.filter(s => stageCompleted(completedStages, s.key)).length;
      const total = STAGE_LABELS.length;
      return done + '/' + total;
    }

    async function fetchProgress() {
      try {
        const res = await fetch('/api/progress');
        const data = await res.json();
        const tbody = document.getElementById('table-body');
        const teams = Object.keys(data);

        // Update stats
        const total = teams.length;
        let playing = 0, finished = 0;
        teams.forEach(t => {
          if (data[t].completed) finished++;
          else if (data[t].completed_stages && data[t].completed_stages.length > 1) playing++;
        });
        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-playing').textContent = playing;
        document.getElementById('stat-finished').textContent = finished;

        if (teams.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">No teams have logged in yet.</td></tr>';
          document.getElementById('last-refresh').textContent = 'Last refresh: ' + new Date().toLocaleTimeString();
          return;
        }

        tbody.innerHTML = '';
        teams.forEach(team => {
          const info = data[team];
          const stages = info.completed_stages || [];
          const tr = document.createElement('tr');

          // Team name
          const tdName = document.createElement('td');
          const strong = document.createElement('strong');
          strong.textContent = team;
          tdName.appendChild(strong);
          const tdProgress = document.createElement('td');
          tdProgress.style.minWidth = '180px';
          const dotsDiv = renderDots(stages);
          const progText = document.createElement('div');
          progText.style.cssText = 'font-size:0.7rem;color:var(--text-muted);margin-top:4px;';
          progText.textContent = renderProgressText(stages) + ' stages — ' + (info.current_stage || 'Not started');
          tdProgress.appendChild(dotsDiv);
          tdProgress.appendChild(progText);

          // Status badge
          const tdStatus = document.createElement('td');
          const badge = document.createElement('span');
          if (info.completed) {
            badge.className = 'badge badge-fin';
            badge.textContent = '✓ Finished';
          } else if (stages.length > 0) {
            badge.className = 'badge badge-play';
            badge.textContent = '▶ Playing';
          } else {
            badge.className = 'badge badge-wait';
            badge.textContent = '○ Waiting';
          }
          tdStatus.appendChild(badge);

          // Last active
          const tdTime = document.createElement('td');
          tdTime.textContent = info.last_updated || '—';
          tdTime.style.fontSize = '0.85rem';

          // Actions
          const tdAction = document.createElement('td');
          const abortBtn = document.createElement('button');
          abortBtn.className = 'btn-abort';
          abortBtn.textContent = '↺ Reset';
          abortBtn.onclick = () => abortTeam(team);
          tdAction.appendChild(abortBtn);

          tr.appendChild(tdName);
          tr.appendChild(tdProgress);
          tr.appendChild(tdStatus);
          tr.appendChild(tdTime);
          tr.appendChild(tdAction);
          tbody.appendChild(tr);
        });
        document.getElementById('last-refresh').textContent = 'Last refresh: ' + new Date().toLocaleTimeString();
      } catch (e) {
        console.error('Failed to fetch progress', e);
      }
    }

    function abortTeam(teamName) {
      if (confirm('Reset all progress for team "' + teamName + '"? This cannot be undone.')) {
        fetch('/api/abort', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team: teamName })
        }).then(() => fetchProgress());
      }
    }

    function resetAll() {
      if (!confirm('Reset ALL teams? This will delete all progress for every team. Are you sure?')) return;
      if (!confirm('Really? All teams will lose all progress.')) return;
      fetch('/api/abort', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ team: '__ALL__' })
      }).then(() => fetchProgress());
    }

    pollInterval = setInterval(fetchProgress, 3000);
    fetchProgress();

    window.addEventListener('beforeunload', function() {
      if (pollInterval) clearInterval(pollInterval);
    });
  </script>
</body>
</html>
