services:
  # Backend API
  - type: web
    name: project-rewind-api
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: project-rewind-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: ""  # ⚠ Set this via Render dashboard secret store — do NOT hardcode passwords in this file
      - key: FRONTEND_URL
        value: https://project-rewind.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

  # Frontend (Static Site)
  - type: web
    name: project-rewind
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://project-rewind-api.onrender.com

databases:
  - name: project-rewind-db
    plan: free
    databaseName: project_rewind
